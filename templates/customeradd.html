{% extends "base.html" %}
{% block content %}
<!-- code in here to display a list of books-->
<h2>Selwyn Campground Add Customer </h2>
<h3>Add new customer</h3>

<form action="/customer/add" method="POST" class="row needs-validation" novalidate>
    <div class="col-auto">
        <label for="firstname" class="form-label">Enter First name: </label>
        <input type="text" class="form-control" name="firstname" required />
        <div class="invalid-feedback">
            Please enter valid first name
        </div>  
    </div>
    <div class="col-auto">
        <label for="familyname" class="form-label">Enter Family name: </label>
        <input type="text" class="form-control" name="familyname" required/>
        <div class="invalid-feedback">
            Please enter valid family name
        </div>  
    </div>
    <div class="col-auto">
        <label for="email" class="form-label">Enter Email Address: </label>
        
        <!-- <input name="email" type="email" id="typeEmail" class="form-control" required/> -->
        <!-- <input name="email" type="email" id="typeEmail" class="form-control" pattern="^[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" required/> -->
        <input name="email" type="text" id="typeEmail" class="form-control" pattern="^[a-zA-Z0-9.!#$%&’*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$" required/>
        
        <div class="invalid-feedback">
            Please enter valid email address
        </div>  
    </div>
    <div class="col-auto">
        <label for="phone" class="form-label">Enter Phone number: </label>
        <input name="phone" class="form-control" type="tel" pattern = "^0\d{8,10}$" required/>
        <div class="invalid-feedback">
            Please enter valid phone number
        </div>  
    </div>
    <div class = "col-auto">
        <input type="submit"/>
    </div>
    
    
    
    
    
</form>



{% endblock %}
