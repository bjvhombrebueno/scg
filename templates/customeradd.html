{% extends "base.html" %}
{% block content %}
<!-- code in here to display a list of books-->
<h2>Selwyn Campground Add Customer </h2>
<h3>Add new customer</h3>

<form action="/customer/add" method="POST" >
    <label for="firstname" class="form-label">Enter First name: </label>
    <input type="text" name="firstname" required />
    <label for="familyname" class="form-label">Enter Family name: </label>
    <input type="text" name="familyname" required/>
    <label for="email" class="form-label">Enter Email Address: </label>
    <input type="text" name="email" required/>
    <label for="phone" class="form-label">Enter Phone number: </label>
    <input type="text" name="phone" required/>
    <input type="submit"/>
    <div class="invalid-feedback">
        Please enter valid data
    </div>  
</form>

{{customerdata}}

{% endblock %}
