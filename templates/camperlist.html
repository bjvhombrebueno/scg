{% extends "base.html" %}
{% block content %}
<h2>Selwyn Campground - Camper List</h2>

<!-- Insert code to loop over the list of campers and display them -->

<!-- {{camperlist}} -->

<table class="table table-hover">
    <thead>
    <tr><th>Booking ID</th><th>First Name</th><th>Family Name</th><th>Site ID</th><th>Occupancy</th></tr>
</thead>
    {% for camper in camperlist%}
        <tr>
            <td>{{camper[0]}}</td>
            <td>{{camper[8]}}</td>
            <td>{{camper[9]}}</td>
            <td>{{camper[1]}}</td>
            <td>{{camper[4]}}</td>
        </tr>
    {% endfor %}
</table>
{% endblock %}
