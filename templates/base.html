<!DOCTYPE html>
<html data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <title>{% block title %}{% endblock %}</title>
        <!-- CSS only -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" type = "text/css" href="{{url_for('static',filename = 'styles/styles.css')}}">
    </head>

    
    <body>
      <h1 style="text-align:center;">Selwyn Campground</h1><br>
           
      <nav class="navbar navbar-expand-lg bg-body-tertiary rounded" aria-label="SCG navbar">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarscg" aria-controls="navbarscg" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse justify-content-md-center" id="navbarscg">
            <ul class="navbar-nav">
              
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('booking') }}">Make Booking</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('campers') }}">View Campers per night</a>
              </li>
              
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('customersearch') }}">Search Customers</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('customeradd') }}">Add Customer</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('mycustomer') }}">My Customer</a>
              </li>

            </ul>
          </div>
        </div>
      </nav>  
      <br>
      <br>
          <section class="content">
            <header>
              {% block header %}{% endblock %}
            </header>
            {% for message in get_flashed_messages() %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
            {% block content %}{% endblock %}
          </section>
        <!-- JavaScript Bundle with Popper -->
       <script> 
        // Example starter JavaScript for disabling form submissions if there are invalid fields
        (() => {
          'use strict'
        
          // Fetch all the forms we want to apply custom Bootstrap validation styles to
          const forms = document.querySelectorAll('.needs-validation')
        
          // Loop over them and prevent submission
          Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
              if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
              }
        
              form.classList.add('was-validated')
            }, false)
          })
        })()
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
